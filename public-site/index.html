<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1725"><title>ArcheAge Chronicles NPC MAP</title>
<style>
:root{--bg:#0b1725;--panel:#152437;--line:#354b61;--text:#e9f2f8;--muted:#b5c6d5;--gold:#f4d69c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,'Meiryo',sans-serif}button,input,select{font:inherit}button,a,select,input{outline-offset:3px}button{cursor:pointer}a{color:var(--gold)}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#0d1d2e;border-bottom:1px solid var(--line);padding:10px 18px;flex-wrap:wrap}.brand small{display:block;letter-spacing:.12em;font-size:10px;color:var(--gold)}.brand strong{font-size:18px}.btn{color:var(--text);background:#21354b;border:1px solid #456078;border-radius:9px;padding:9px 12px;text-decoration:none;display:inline-block}.btn:hover{background:#304862}.gold{background:#ecd19c;color:#18202b;border-color:#efd7aa;font-weight:700}.gold:hover{background:#ffe3ab}.layout{display:grid;grid-template-columns:minmax(295px,360px) minmax(0,1fr);height:calc(100dvh - 61px);min-height:560px}.side{overflow:auto;padding:16px;display:grid;align-content:start;gap:12px;background:var(--panel);border-right:1px solid var(--line)}.section{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:#102031}h2,h3,p{margin:0}h2{font-size:19px}h3{font-size:14px}.muted,.note{color:var(--muted);font-size:12px}input,select{width:100%;background:#0b1929;border:1px solid #50647b;color:var(--text);padding:10px;border-radius:8px;min-width:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map-choices{display:grid;gap:7px}.map-choices button{text-align:left}.map-choices button[aria-pressed=true]{border-color:var(--gold);background:#344254}.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.list{display:grid;gap:6px;max-height:250px;overflow:auto}.npc{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#152a40;color:var(--text);text-align:left}.npc small{display:block;color:var(--muted)}.legend{display:flex;flex-wrap:wrap;gap:8px}.legend span{font-size:12px;background:#23384e;padding:4px 7px;border-radius:20px}.dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;margin-right:4px}.map{position:relative;overflow:hidden;min-height:400px;background:#091321}.toolbar{position:absolute;z-index:5;display:flex;justify-content:space-between;align-items:center;left:12px;right:12px;top:12px;gap:10px;pointer-events:none}.toolbar>div{pointer-events:auto;background:#0f2235e8;border:1px solid var(--line);padding:7px 9px;border-radius:9px}.tools{display:flex;gap:4px}.tools button{padding:6px 10px}.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}.stage img{width:1920px;height:1080px;display:block;pointer-events:none;max-width:none}.pin{position:absolute;transform:translate(-50%,-100%);border:1px solid #ffffff55;border-radius:20px 20px 20px 3px;padding:6px 10px;font-weight:750;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 9px #0009;touch-action:manipulation}.pin:focus-visible{outline:3px solid white}.foot{position:absolute;left:10px;bottom:12px;right:10px;pointer-events:none}.foot span{background:#102235d9;border-radius:6px;padding:4px 7px;font-size:11px;color:#dbe5ee}.detail{white-space:pre-wrap;overflow-wrap:anywhere}.detail dl{margin:0;display:grid;gap:5px}.detail dt{color:var(--muted);font-size:11px}.detail dd{margin:0 0 5px}.error{border-left:3px solid #e8b078;padding:8px;background:#32271b;color:#f7d8b8}.hidden{display:none!important}@media(max-width:820px){.layout{display:flex;flex-direction:column;height:auto;min-height:0}.map{order:0;height:57dvh;min-height:320px}.side{order:1;overflow:visible;border-right:0}.top{padding:9px 12px}.brand strong{font-size:15px}.toolbar{left:7px;right:7px;top:7px}.toolbar>div{font-size:12px}.tools button{padding:5px 8px}}@media(max-width:420px){.top{align-items:flex-start}.brand small{font-size:9px}.gold{padding:7px 9px;font-size:12px}}
</style></head><body>
<header class="top"><div class="brand"><small>ARCHEAGE CHRONICLES · FAN MAP</small><strong>NPC位置管理マップ</strong></div><a class="btn gold" href="https://forms.gle/JxThJxyv6kwk2gdq7" rel="noopener noreferrer" target="_blank">✉ NPC情報を提供する ↗</a></header>
<div class="layout"><aside class="side"><div><h2>輝く海岸 NPCマップ</h2><p class="muted">承認済みのNPC情報を公開しています。地図は拡大・移動できます。</p></div><section class="section"><h3>マップを選ぶ</h3><div id="maps" class="map-choices"></div><p class="note">全体図の案内ピンから詳細マップへ移動できます。案内位置は仮置きです。</p></section><section class="section"><div class="row"><h3>公開データ</h3><button id="refresh" type="button" class="btn">再取得</button></div><div id="status" class="note" role="status">読み込み中…</div><div id="error" class="error hidden" role="alert"></div></section><section class="section"><div class="row"><h3>NPCを探す</h3><span id="count" class="note">0件</span></div><input id="search" type="search" placeholder="NPC名・場所・メモで検索" aria-label="NPC検索"><div class="filters"><select id="category" aria-label="カテゴリー"><option value="">全カテゴリー</option></select><select id="sort" aria-label="並べ替え"><option value="name">名前順</option><option value="category">分類順</option><option value="area">マップ順</option></select></div><div id="npcList" class="list"></div><div id="legend" class="legend"></div></section><section id="detailSection" class="section hidden"><h3>NPCの詳細</h3><div id="detail" class="detail"></div></section><section class="section"><h3>情報提供</h3><p class="note">NPCの情報はGoogleフォームから送信できます。管理者の確認後に地図へ反映されます。</p><a class="btn gold" href="https://forms.gle/JxThJxyv6kwk2gdq7" target="_blank" rel="noopener noreferrer">NPC情報を提供する ↗</a></section></aside>
<main class="map" aria-label="ゲームマップ"><div class="toolbar"><div id="mapTitle">輝く海岸（全体）</div><div class="tools"><button class="btn" id="minus" aria-label="縮小">－</button><button class="btn" id="reset">全体</button><button class="btn" id="plus" aria-label="拡大">＋</button></div></div><div class="viewport" id="viewport"><div class="stage" id="stage"><img id="mapImage" alt="ゲームマップ"><div id="markers"></div></div></div><div class="foot"><span>ドラッグで移動・ホイールで拡大</span></div></main></div>
<script>
'use strict';
const MAPS=[{id:'coast',name:'輝く海岸（全体）',image:'images/kagayaku_coast_overview.png',parent:null},{id:'coast_north',name:'輝く海岸・北岸（詳細）',image:'images/kagayaku_coast_detail_01.png',parent:'coast',overviewPoint:{x:805,y:183}}];
const CSV_URL='/api/npcs';
const W=1920,H=1080,$=id=>document.getElementById(id);
const defaults={'商人':{color:'#fbbf24',icon:'🛒'},'クエスト':{color:'#a78bfa',icon:'📜'},'職人':{color:'#34d399',icon:'⚒'},'その他':{color:'#67c8ff',icon:'●'}};
const palette=['#fb7185','#60a5fa','#f9a8d4','#fbbf24','#2dd4bf','#c4b5fd'];
let styles={},npcs=[],mapId='coast',scale=1,tx=0,ty=0,pointer=null,selectedId=null,loadBusy=false;
const currentMap=()=>MAPS.find(m=>m.id===mapId);
function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e;}
function parseCSV(s){s=s.replace(/^\ufeff/,'');const result=[];let row=[],field='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){field+='"';i++;}else if(c==='"')quoted=false;else field+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(field);field='';}else if(c==='\n'){row.push(field.replace(/\r$/,''));result.push(row);field='';row=[];}else field+=c;}if(field||row.length){row.push(field.replace(/\r$/,''));result.push(row);}return result;}
function parseNpcCSV(raw){if(/^\s*<(?:!doctype|html)/i.test(raw))throw Error('CSVの代わりにHTMLが返されました。');const rows=parseCSV(raw),headers=(rows.shift()||[]).map(s=>s.trim());const k=headers.includes('mapId')?'mapId':headers.includes('areaId')?'areaId':null;if(!['name','x','y'].every(v=>headers.includes(v))||!k)throw Error('必要な列名は name, mapId, x, y です。');let ignored=0;const items=[];rows.forEach((r,i)=>{if(!r.some(x=>x.trim()))return;const n={};headers.forEach((h,j)=>n[h]=String(r[j]??'').trim());if(headers.includes('status')&&!['公開','承認済','approved','published','publish'].includes((n.status||'').toLowerCase()))return;let x=Number(n.x),y=Number(n.y);if(!n.name||!MAPS.some(m=>m.id===n[k])||n.x===''||n.y===''||!Number.isFinite(x)||!Number.isFinite(y)||x<0||y<0||x>W||y>H){ignored++;return;}items.push({id:n.id||'row-'+i,name:n.name,mapId:n[k],x,y,category:n.category||'その他',location:n.location||'',memo:n.memo||''});});return{items,ignored};}
function styleFor(name){if(styles[name])return styles[name];if(defaults[name])return defaults[name];let n=0;for(let c of String(name))n=(n*31+c.codePointAt(0))>>>0;return{color:palette[n%palette.length],icon:'●'};}
function readable(hex){const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>160?'#15202d':'white';}
async function loadStyles(){try{const r=await fetch('category-styles.json',{cache:'no-store'});if(!r.ok)return;const data=await r.json();let obj=data.styles||data;for(const [k,v]of Object.entries(obj)){if(v&&/^#[0-9a-fA-F]{6}$/.test(v.color)&&typeof v.icon==='string'&&v.icon.length<=8)styles[k]=v;}}catch(e){}render();}
async function load(){if(loadBusy)return;loadBusy=true;$('refresh').disabled=true;$('status').textContent='Googleシートを読み込み中…';$('error').classList.add('hidden');try{const res=await fetch(CSV_URL,{cache:'no-store',credentials:'omit'});if(!res.ok)throw Error('HTTP '+res.status+'（公開用CSVの取得に失敗）');const {items,ignored}=parseNpcCSV(await res.text());npcs=items;$('status').textContent=items.length+'件取得（Googleシート）'+(ignored?' · 不正なデータ'+ignored+'件を除外':'');render();}catch(e){$('status').textContent='自動取得に失敗';$('error').textContent='データを取得できませんでした。通信状況を確認し「再取得」を押してください。詳細: '+e.message+'。既存表示がある場合は保持しています。';$('error').classList.remove('hidden');}finally{loadBusy=false;$('refresh').disabled=false;}}
function filtered(){const q=$('search').value.trim().toLocaleLowerCase(),cat=$('category').value;return npcs.filter(n=>(!cat||n.category===cat)&&(!q||[n.name,n.location,n.memo,MAPS.find(m=>m.id===n.mapId)?.name].some(t=>String(t||'').toLocaleLowerCase().includes(q)))).sort((a,b)=>{let k=$('sort').value;return String((k==='area'?MAPS.find(m=>m.id===a.mapId)?.name:a[k])||'').localeCompare(String((k==='area'?MAPS.find(m=>m.id===b.mapId)?.name:b[k])||''),'ja');});}
function selectNpc(n){selectedId=n.id;showMap(n.mapId,false);const d=$('detail');d.replaceChildren();const dl=make('dl');[['名前',n.name],['カテゴリー',n.category],['マップ',currentMap().name],['出現場所',n.location||'記載なし'],['メモ',n.memo||'記載なし']].forEach(([label,v])=>{dl.append(make('dt','',label),make('dd','',v));});d.append(dl);$('detailSection').classList.remove('hidden');renderMarkers();if(innerWidth<821)$('detailSection').scrollIntoView({block:'nearest',behavior:'smooth'});}
function showMap(id,reset=true){mapId=id;const m=currentMap();$('mapImage').src=m.image;$('mapTitle').textContent=m.name;if(reset){selectedId=null;$('detailSection').classList.add('hidden');}fit();render();}
function render(){const mapButtons=$('maps');mapButtons.replaceChildren();MAPS.forEach(m=>{const b=make('button','btn',m.name);b.type='button';b.setAttribute('aria-pressed',String(m.id===mapId));b.addEventListener('click',()=>showMap(m.id));mapButtons.append(b);});const categories=[...new Set(npcs.map(n=>n.category))].sort((a,b)=>a.localeCompare(b,'ja'));const filter=$('category'),old=filter.value;filter.replaceChildren();filter.append(new Option('全カテゴリー',''));categories.forEach(c=>filter.append(new Option(c,c)));filter.value=categories.includes(old)?old:'';const matches=filtered();$('count').textContent=matches.length+'件';const box=$('npcList');box.replaceChildren();if(!matches.length)box.append(make('div','note','該当するNPCがありません'));matches.forEach(n=>{const b=make('button','npc');b.type='button';b.append(make('strong','',n.name),make('small','',n.category+' · '+(MAPS.find(m=>m.id===n.mapId)?.name||n.mapId)));b.addEventListener('click',()=>selectNpc(n));box.append(b);});const legend=$('legend');legend.replaceChildren();categories.forEach(c=>{const s=styleFor(c),x=make('span');const d=make('span','dot',s.icon);d.style.background=s.color;d.style.color=readable(s.color);x.append(d,make('span','',c));legend.append(x);});renderMarkers();}
function renderMarkers(){const box=$('markers');box.replaceChildren();if(mapId==='coast'){for(const m of MAPS.filter(m=>m.parent==='coast'&&m.overviewPoint)){const b=make('button','pin','↗ '+m.name);b.style.left=m.overviewPoint.x+'px';b.style.top=m.overviewPoint.y+'px';b.style.background='#eac983';b.style.color='#17212e';b.title='詳細マップへ';b.addEventListener('click',()=>showMap(m.id));box.append(b);}}for(const n of filtered().filter(n=>n.mapId===mapId)){const s=styleFor(n.category),b=make('button','pin',s.icon+' '+n.name);b.style.left=n.x+'px';b.style.top=n.y+'px';b.style.background=s.color;b.style.color=readable(s.color);b.title=n.name+' / '+n.category;b.addEventListener('click',()=>selectNpc(n));if(n.id===selectedId)b.style.outline='3px solid white';box.append(b);}}
const viewport=$('viewport'),stage=$('stage');function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}function fit(){let r=viewport.getBoundingClientRect();if(!r.width||!r.height)return;scale=Math.min(r.width/W,r.height/H);tx=(r.width-W*scale)/2;ty=(r.height-H*scale)/2;apply();}function zoom(k,x,y){const r=viewport.getBoundingClientRect();x=x??r.width/2;y=y??r.height/2;const next=Math.max(.15,Math.min(4,scale*k));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;apply();}viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;pointer={x:e.clientX,y:e.clientY,ox:tx,oy:ty};viewport.setPointerCapture(e.pointerId);});viewport.addEventListener('pointermove',e=>{if(!pointer)return;tx=pointer.ox+e.clientX-pointer.x;ty=pointer.oy+e.clientY-pointer.y;apply();});function end(e){if(pointer&&viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId);pointer=null;}viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);$('reset').onclick=fit;$('refresh').onclick=load;$('search').oninput=render;$('sort').onchange=render;$('category').onchange=render;window.addEventListener('resize',fit);$('mapImage').addEventListener('error',()=>{$('error').textContent='画像ファイルが見つかりません。imagesフォルダを確認してください。';$('error').classList.remove('hidden');});showMap('coast');loadStyles();load();setInterval(()=>{if(!document.hidden)load();},300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script></body></html>
